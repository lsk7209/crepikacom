name: Auto Publish Utility Tool

on:
  schedule:
    # Check frequently; publish-tool-once.mjs enforces the five-hour cadence.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the next ready tool even if five hours have not passed"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: auto-publish-tools
  cancel-in-progress: false

jobs:
  publish-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish next ready utility tool
        env:
          FORCE_TOOL_PUBLISH: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          TOOL_PUBLISH_MIN_HOURS: "5"
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish-tool-once.mjs

      - name: Verify SEO gates
        run: node scripts/verify-seo-gates.mjs
