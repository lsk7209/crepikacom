name: Auto Publish Blog Post

on:
  schedule:
    # 하루 1회 (UTC 0시 = KST 9시). 빌드 비용 절감: 5편을 1배치로 묶어 1회 push.
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check remaining drafts
        id: check
        run: |
          REMAINING=$(node -e "
            const fs = require('fs');
            const q = JSON.parse(fs.readFileSync('scripts/post-queue.json','utf-8'));
            const draftsDir = 'scripts/drafts';
            const count = q.filter(e => !e.published && fs.existsSync(draftsDir+'/'+e.slug+'.json')).length;
            console.log(count);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          echo "📊 발행 가능한 드래프트: $REMAINING 개"

      - name: Publish batch from drafts
        if: steps.check.outputs.remaining != '0'
        env:
          BATCH_SIZE: '5'
        run: node scripts/publish-once.mjs

      - name: All done
        if: steps.check.outputs.remaining == '0'
        run: echo "✅ 모든 드래프트 발행 완료!"
