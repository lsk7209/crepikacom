name: Auto Publish Blog Post

on:
  schedule:
    # Run once per day and publish a small batch to reduce Vercel build churn.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check remaining drafts
        id: check
        run: |
          REMAINING=$(node -e "
            const fs = require('fs');
            const q = JSON.parse(fs.readFileSync('scripts/post-queue.json','utf-8'));
            const draftsDir = 'scripts/drafts';
            const count = q.filter(e => !e.published && fs.existsSync(draftsDir + '/' + e.slug + '.json')).length;
            console.log(count);
          ")
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "Publishable drafts: $REMAINING"

      - name: Publish batch from drafts
        if: steps.check.outputs.remaining != '0'
        env:
          BATCH_SIZE: "5"
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: node scripts/publish-once.mjs

      - name: Verify SEO gates
        run: node scripts/verify-seo-gates.mjs

      - name: All done
        if: steps.check.outputs.remaining == '0'
        run: echo "All drafts have been published."
