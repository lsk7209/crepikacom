<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff7ed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Top accent bar -->
  <rect width="1200" height="6" fill="url(#title)" />

  <!-- Logo spark icon area -->
  <rect x="80" y="100" width="72" height="72" rx="18" fill="#0891b2" fill-opacity="0.12" />
  <text x="116" y="148" font-size="36" text-anchor="middle" fill="#0891b2">✦</text>

  <!-- Site name -->
  <text x="172" y="152" font-family="'Noto Sans KR', Arial, sans-serif" font-size="42" font-weight="800" fill="#0891b2">크레피카</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="'Noto Sans KR', Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a">크리에이터 필수 도구함</text>

  <!-- Sub headline -->
  <text x="80" y="345" font-family="'Noto Sans KR', Arial, sans-serif" font-size="32" fill="#475569">No Login. 3-Second Tools.</text>

  <!-- Tool badges -->
  <rect x="80" y="400" width="180" height="48" rx="10" fill="#0891b2" fill-opacity="0.1" />
  <text x="170" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">QR 생성기</text>

  <rect x="276" y="400" width="200" height="48" rx="10" fill="#0891b2" fill-opacity="0.1" />
  <text x="376" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">글자수 세기</text>

  <rect x="492" y="400" width="200" height="48" rx="10" fill="#0891b2" fill-opacity="0.1" />
  <text x="592" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">WebP 변환기</text>

  <rect x="708" y="400" width="220" height="48" rx="10" fill="#0891b2" fill-opacity="0.1" />
  <text x="818" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0891b2">해시태그 믹서</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">crepika.com</text>

  <!-- Decorative circles -->
  <circle cx="1050" cy="200" r="120" fill="#0891b2" fill-opacity="0.06" />
  <circle cx="1100" cy="450" r="80" fill="#fb923c" fill-opacity="0.07" />
</svg>
