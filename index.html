        <h1>크레피카 | 크리에이터를 위한 무료 온라인 도구함</h1>
        <p>크레피카는 국내 크리에이터, 마케터, 소규모 브랜드 운영자가 반복적으로 수행하는 콘텐츠 제작 작업을 줄이기 위해 만든 무료 웹 도구 서비스입니다. 로그인 없이 QR 코드 생성기, 텍스트 카운터, 한글 바이트 카운터, WebP 변환기, 인스타그램 줄바꿈 포매터, 해시태그 믹서를 바로 사용할 수 있습니다.</p>
        <h2>주요 도구</h2>
        <ul>
          <li><a href="/tools/text-counter">텍스트 카운터</a>: 글자 수, 단어 수, 줄 수를 실시간으로 확인합니다.</li>
          <li><a href="/tools/byte-counter">한글 바이트 카운터</a>: UTF-8 기준 바이트 수를 계산해 메타 설명과 SMS 문구 길이를 점검합니다.</li>
          <li><a href="/tools/webp-converter">WebP 변환기</a>: JPG와 PNG 이미지를 WebP로 변환해 웹사이트 로딩 속도 개선을 돕습니다.</li>
          <li><a href="/tools/qr-generator">QR 코드 생성기</a>: URL과 텍스트를 QR 코드 PNG 이미지로 변환합니다.</li>
        </ul>
        <h2>운영 정책</h2>
        <p>도구 입력 데이터는 원칙적으로 이용자의 브라우저 안에서 처리되며 서버에 저장하지 않습니다. 서비스 운영 주체, 문의 경로, 광고와 쿠키 처리 기준은 <a href="/about">소개</a>, <a href="/contact">문의하기</a>, <a href="/privacy">개인정보처리방침</a>, <a href="/terms">이용약관</a>에서 확인할 수 있습니다.</p>
